<!DOCTYPE html>
<html>
<head>
<title>Lofer</title>
<style>
body{font-family:sans-serif;text-align:center;background:#ffd6e0;}
.container{background:white;padding:20px;margin:20px auto;max-width:400px;border-radius:10px;}
input{margin:5px;padding:10px;width:90%;}
button{padding:10px;margin:5px;background:#ff4d88;color:white;border:none;border-radius:5px;}
.card{background:#ffe5ec;margin:10px;padding:10px;border-radius:5px;}
</style>
</head>

<body>

<h1>Lofer</h1>

<div id="loginBox" class="container">
<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">
<button onclick="login()">Entrar</button>
</div>

<div id="app" class="container" style="display:none;">
<input id="nombre" placeholder="Nombre">
<input id="serie" placeholder="Serie">
<input id="desc" placeholder="Descripción">

<button onclick="agregar()">Agregar</button>
<button onclick="actualizar()">Actualizar</button>
<button onclick="salir()">Salir</button>

<div id="lista"></div>
</div>

<script>

// 🔥 IMPORTANTE
const API = "http://127.0.0.1:5000"; // CAMBIA SI ES CELULAR O INTERNET

let seleccionado = null;

// LOGIN
async function login(){
let res = await fetch(API+"/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username:user.value,
password:pass.value
})
});

if(res.ok){
loginBox.style.display="none";
app.style.display="block";
cargar();
}else{
alert("Login incorrecto");
}
}

// CARGAR
async function cargar(){
let res = await fetch(API+"/items");
let data = await res.json();

lista.innerHTML="";
data.forEach(i=>{
lista.innerHTML+=`
<div class="card" onclick="seleccionar(${i.id},'${i.nombre}','${i.numeroSerie}','${i.descripcion}')">
${i.nombre} - ${i.numeroSerie}<br>${i.descripcion}
<button onclick="event.stopPropagation();eliminar(${i.id})">X</button>
</div>`;
});
}

// SELECCIONAR
function seleccionar(id,n,s,d){
seleccionado=id;
nombre.value=n;
serie.value=s;
desc.value=d;
}

// AGREGAR
async function agregar(){
await fetch(API+"/items",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
nombre:nombre.value,
numeroSerie:serie.value,
descripcion:desc.value
})
});
cargar();
}

// ACTUALIZAR
async function actualizar(){
if(!seleccionado) return alert("Selecciona uno");

await fetch(API+"/items/"+seleccionado,{
method:"PUT",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
nombre:nombre.value,
numeroSerie:serie.value,
descripcion:desc.value
})
});

cargar();
}

// ELIMINAR
async function eliminar(id){
await fetch(API+"/items/"+id,{method:"DELETE"});
cargar();
}

// SALIR
function salir(){
app.style.display="none";
loginBox.style.display="block";
}

</script>

</body>
</html>
