<!DOCTYPE html>
<html>
<head>
<title>Lofer</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Pacifico&display=swap" rel="stylesheet">

<style>
body{
    font-family:'Poppins';
    margin:0;
    background: linear-gradient(135deg,#ffd6e0,#ffc2d1,#ffb3c6);
    text-align:center;
}

/* 🔥 LOGO PRO */
.logo{
    font-family: 'Pacifico', cursive;
    font-size: 60px;
    background: linear-gradient(45deg, #ff4d88, #ff8fab, #ffc2d1, #ff4d88);
    background-size: 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: brillo 4s infinite;
    text-shadow: 0 0 20px rgba(255, 77, 136, 0.4);
    margin-top: 30px;
}

@keyframes brillo {
    0%{ background-position: 0%; }
    100%{ background-position: 300%; }
}

/* fondo */
.bg div{
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
}
.s1{width:200px;height:200px;background:#ff8fab;top:10%;left:5%;}
.s2{width:300px;height:300px;background:#ffc2d1;bottom:10%;right:5%;}
.s3{width:250px;height:250px;background:#ffb3c6;top:50%;left:40%;}

.container{
    background:rgba(255,255,255,0.2);
    backdrop-filter:blur(15px);
    margin:auto;
    margin-top:40px;
    padding:20px;
    max-width:400px;
    border-radius:20px;
}

input{
    padding:10px;
    margin:5px;
    border-radius:10px;
    border:none;
    width:90%;
}

button{
    padding:10px;
    border:none;
    border-radius:10px;
    background:#ff4d88;
    color:white;
    cursor:pointer;
}

.card{
    background:rgba(255,255,255,0.3);
    margin:10px;
    padding:10px;
    border-radius:10px;
}

footer{
    margin-top:20px;
    font-size:12px;
    color:#fff;
}
</style>
</head>

<body>

<div class="bg">
<div class="s1"></div>
<div class="s2"></div>
<div class="s3"></div>
</div>

<h1 class="logo">Lofer</h1>

<!-- LOGIN -->
<div id="loginBox" class="container">
<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">
<button type="button" onclick="login(event)">Entrar</button>
</div>

<!-- APP -->
<div id="app" class="container" style="display:none;">
<input id="nombre" placeholder="Nombre">
<input id="serie" placeholder="Serie">
<input id="desc" placeholder="Descripción">

<button onclick="agregar()">Agregar</button>
<button onclick="actualizar()">Actualizar</button>
<button onclick="salir()">Salir</button>

<div id="lista"></div>
</div>

<footer>equipo EMY</footer>

<script>
const API = "http://127.0.0.1:5000";
let seleccionado=null;

// LOGIN
async function login(e){
if(e) e.preventDefault();

let res=await fetch(`${API}/login`,{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
username:user.value,
password:pass.value
})
});

if(res.ok){
loginBox.style.display='none';
app.style.display='block';
cargar();
}else{
alert("Usuario o contraseña incorrectos");
}
}

// CARGAR
async function cargar(){
let res=await fetch(`${API}/items`);
let data=await res.json();

lista.innerHTML="";

data.forEach(i=>{
lista.innerHTML+=`
<div class="card" onclick="seleccionar(${i.id},'${i.nombre}','${i.numeroSerie}','${i.descripcion}')">
<b>${i.nombre}</b><br>
${i.numeroSerie}<br>
${i.descripcion}
<br>
<button onclick="event.stopPropagation();eliminar(${i.id})">X</button>
</div>`;
});
}

// SELECCIONAR
function seleccionar(id,n,s,d){
seleccionado=id;
nombre.value=n;
serie.value=s;
desc.value=d;
}

// AGREGAR
async function agregar(){
await fetch(`${API}/items`,{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
nombre:nombre.value,
numeroSerie:serie.value,
descripcion:desc.value
})
});
limpiar();
cargar();
}

// ACTUALIZAR
async function actualizar(){
if(!seleccionado)return alert("Selecciona uno");

let res=await fetch(`${API}/items/${seleccionado}`,{
method:'PUT',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
nombre:nombre.value,
numeroSerie:serie.value,
descripcion:desc.value
})
});

if(res.ok){
alert("Actualizado");
limpiar();
cargar();
}else{
alert("Error al actualizar");
}
}

// ELIMINAR
async function eliminar(id){
await fetch(`${API}/items/${id}`,{method:'DELETE'});
cargar();
}

// LIMPIAR
function limpiar(){
nombre.value="";
serie.value="";
desc.value="";
seleccionado=null;
}

// SALIR
function salir(){
app.style.display='none';
loginBox.style.display='block';
}
</script>

</body>
</html>
